[workspace]
members = ["crates/core", "crates/storage", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
fclones = "0.35.0"
iced = { version = "0.13", features = ["tokio"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
trash = "5"
tracing = "0.1"
tracing-subscriber = "0.3"
