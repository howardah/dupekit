name = "dupekit"
product-name = "Dupekit"
version = "0.1.1"
authors = ["Adam Thomas Howard <adam.thomas.howard@gmail.com>"]
identifier = "com.howardah.dupekit"
publisher = "Howardah"
category = "Utility"
description = "Safe duplicate-file discovery and cleanup"
# Select the platform's default formats. Without this, the Debian-only
# configuration is ignored on macOS and packager finds no enabled format.
formats = ["default"]
before-packaging-command = "cargo build --release --package dupekit --bin dupekit --target-dir target"
out-dir = "target/release"

[[binaries]]
path = "dupekit"
main = true

[deb]
section = "utils"
priority = "optional"
